name: Android APK Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, android-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository aajuk
        uses: actions/checkout@v4

      - name: Java piareersaruk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle piareersaruk
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: API regression tests
        run: node --test tests/chat.test.mjs

      - name: APK sanajuk
        run: gradle assembleDebug lintDebug --no-daemon

      - name: APK toqqoruk
        uses: actions/upload-artifact@v4
        with:
          name: OQAASERISSOQ-AI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
